<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri ân thầy cô 20/11</title>
<style>
body{margin:0;background:#000;height:100vh;display:flex;align-items:center;justify-content:center}
video{width:100%;max-height:100vh}
#tap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:rgba(0,0,0,.35);color:#fff;font:bold 22px sans-serif;text-align:center;cursor:pointer}
#tap span{font-size:72px;animation:p 1.2s infinite}
@keyframes p{50%{transform:scale(1.2)}}
</style></head><body>
<video id="v" src="video.mp4" autoplay muted playsinline loop></video>
<div id="tap"><span>🎁</span>Chạm vào màn hình để mở BLINDBOX 20/11</div>
<script>
const v=document.getElementById('v'),t=document.getElementById('tap');
t.onclick=()=>{v.muted=false;v.loop=false;v.currentTime=0;v.play();v.controls=true;t.remove();};
</script></body></html>
